name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy src scripts tests

      - name: Tests
        run: pytest -q

      - name: dbt parse
        env:
          CODRONA_DUCKDB: target/ci.duckdb
        run: |
          dbt deps
          dbt parse --target ci
      - name: Repository hygiene
        run: python3 scripts/repo_checks.py
