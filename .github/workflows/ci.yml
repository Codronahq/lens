name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy src scripts tests

      - name: Tests
        run: pytest -q

      - name: dbt build against synthetic fixtures
        env:
          CODRONA_DUCKDB: target/ci.duckdb
          CODRONA_SILVER_CF: target/fixtures/lake/silver/cf_submissions
          CODRONA_SILVER_CODENET: target/fixtures/lake/silver/codenet_submissions
          CODRONA_CODENET_METADATA: target/fixtures/raw/codenet/Project_CodeNet/metadata
          CODRONA_CF_RATED_LIST: target/fixtures/raw/codeforces/ratedList/ratedList_activeOnly_20260806.json
          CODRONA_CF_PROBLEMSET: target/fixtures/raw/codeforces/problemset/problemset_20260812T004059.jsonl
          CODRONA_ZEROTRAC_JSON: target/fixtures/raw/zerotrac/data_881a239306ce7a339e32e7825cdb9c00fead00f1.json
          CODRONA_CODECONTESTS_PARQUET: target/fixtures/raw/codecontests/codecontests_codenet_802411c3010cb00d1b05bad57ca77365a3c699d6.parquet
        run: |
          dbt deps
          dbt parse --target ci
          python3 scripts/make_ci_fixtures.py --root target/fixtures
          dbt build --target ci --exclude tag:real_data

      # The warehouse tests gate the tables; this gates the artefact that
      # leaves the machine. Run against the synthetic fixture warehouse, so
      # the export path itself is exercised on every push.
      - name: Observatory export gate
        run: |
          python3 -m codrona_lens.observatory.export \
            --database target/ci.duckdb --out target/export-ci --check

      - name: Repository hygiene
        run: python3 scripts/repo_checks.py
