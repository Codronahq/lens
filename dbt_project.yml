name: codrona_lens
version: "0.0.0"
config-version: 2

profile: codrona_lens

model-paths: ["models"]
seed-paths: ["seeds"]
# "tests" is the pytest suite; dbt singular tests live apart from it.
test-paths: ["dbt_tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Minimum cell size for any published observatory aggregate. It lives here
# rather than in a model because two models enforce it and a threshold
# duplicated per model drifts the moment one of them is edited.
vars:
  min_cohort_users: 5

models:
  codrona_lens:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

snapshots:
  codrona_lens:
    +target_schema: snapshots
    +strategy: check
    +invalidate_hard_deletes: false
