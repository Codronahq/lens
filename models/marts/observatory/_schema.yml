version: 2
models:
  - name: obs_rating_distribution
    description: >
      Cohort users per Codeforces rating band. The honest denominator for every
      sliced chart: this one covers all 55,484 collected users. Counts are
      cohort counts under the stratified sampling policy, never platform totals.
    columns:
      - name: rating_band
        tests: [unique, not_null]
      - name: band_order
        tests: [unique, not_null]
      - name: cohort_users
        tests: [not_null]
      - name: cohort_share_pct
        tests: [not_null]

  - name: obs_activity_by_year
    description: >
      Submissions, active users and problems attempted per year. The final year
      is truncated by the collection window and flags itself, so a chart cannot
      imply a collapse that is really a partial year. The participation rate is
      not bounded by 100: four users of the 55,484 have submissions predating
      the registration time Codeforces reports for them, which is enough to put
      2010 at 103.23% on 32 active users against 31 registered by then. The
      figure is published unclamped, because the inconsistency is in the source
      and clamping it would hide real signal rather than correct anything.
    columns:
      - name: submitted_year
        tests: [unique, not_null]
      - name: submissions
        tests: [not_null]
      - name: is_partial_year
        tests: [not_null]
      - name: accepted_pct
        description: Share of submissions accepted. Bounded 0-100 by construction.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: registered_by_then
        description: >
          Cohort registrations up to and including this year, resolved as-of
          rather than by an equality join on the year. The join it replaced
          emitted NULL for any year in which nobody registered, even though the
          count is well defined for that year; every real year carries
          registrations, so only the synthetic fixtures ever showed it.
        tests: [not_null]
      - name: active_share_pct
        description: >
          Active users in the year over registered_by_then. Deliberately NOT
          range-tested to 100, unlike accepted_pct - see the table description.
          A NULL here would mean the denominator was zero, which is why the test
          is not_null rather than a range: that case must fail loudly rather
          than publish a blank cell.
        tests: [not_null]

  - name: obs_tag_landscape
    description: >
      Per-tag problem counts with Codeforces' own ratings and population-wide
      solve counts. Both difficulty columns are independent of our cohort, which
      is why they are carried together. A problem appears once per tag.
    columns:
      - name: tag
        tests: [unique, not_null]
      - name: problems_with_tag
        tests: [not_null]

  - name: obs_country_participation
    description: >
      Cohort users by self-declared country, with the undeclared population
      emitted as its own row. Country is optional and declaring it correlates
      with strength (1212.5 mean against 937.0), so every slice here describes a
      stronger-than-average subpopulation and must be labelled as such. Cells
      below the minimum size keep their name and count but publish no rating
      statistics: at one user, a mean is that person's rating.
    columns:
      - name: country
        tests: [unique, not_null]
      - name: is_undeclared
        tests: [not_null]
      - name: cohort_users
        tests: [not_null]
      - name: is_reportable
        description: >
          False where the cell holds fewer than min_cohort_users people. The
          rating statistics are null on those rows; the name and count remain
          so the denominator stays visible.
        tests: [not_null]

  - name: obs_organization_participation
    description: >
      Cohort users by declared organisation, free text and unnormalised.
      Organisations with fewer than five users are collapsed into a single
      suppressed row carrying only a count, because organisation plus rating is
      close to identifying at small cell sizes.
    columns:
      - name: organization
        tests: [unique, not_null]
      - name: cohort_users
        tests: [not_null]
      - name: is_reportable
        tests: [not_null]
