version: 2

sources:
  - name: codenet
    description: >
      IBM Project CodeNet. Dataset under CDLA-Permissive-2.0, tooling under
      Apache-2.0. Verified 2026-08-03. See LEGAL.md.
    meta:
      licence: CDLA-Permissive-2.0
      legal_status: verified
    tables:
      - name: raw_submissions
      - name: raw_problems

  - name: codeforces
    description: >
      Codeforces official API, self-collected. VERIFIED 2026-08-04; see LEGAL.md.
      The third-party end-2024 bulk release is declined and is not ingested.
      Link-never-host: no problem statements or editorials are stored or served.
    meta:
      licence: none-stated-site-terms-govern
      legal_status: verified
      min_interval_ms: 2000
    tables:
      - name: raw_submissions
      - name: raw_problems
      - name: raw_users
      - name: raw_contests

  - name: atcoder
    description: >
      AtCoder direct ingestion. VERIFIED 2026-08-04 as DO NOT INGEST; see LEGAL.md.
      The kenkoooo bulk dataset states no data licence and carries no AI-training
      opt-out signal, and AtCoder publishes no official API, so no self-collection
      route exists. AtCoder problems and pre-2021 submissions reach the warehouse
      through the codenet and codecontests sources instead. Per-user profile reads
      for a self-connected handle are an application concern, not a warehouse source.
    meta:
      licence: none-stated
      legal_status: do-not-ingest
      min_interval_ms: 1000
    tables: []

  - name: codecontests
    description: >
      DeepMind CodeContests. Apache-2.0 code, CC BY 4.0 non-code. VERIFIED
      2026-08-04, PARTITIONED; see LEGAL.md. Ingest CodeNet-sourced problems only,
      filtered on the ContestProblem source field. Codeforces-sourced and
      description2code-sourced problems are excluded. Upstream is archived and
      frozen; snapshot at ingest and record the download date.
    meta:
      licence: CC-BY-4.0
      legal_status: verified-partitioned
      allowed_problem_sources: ["Aizu", "AtCoder"]
      upstream_archived: "2024-12-06"
    tables:
      - name: raw_problems
      - name: raw_solutions
      - name: raw_tests

  - name: zerotrac
    description: >
      LeetCode problem difficulty estimates by Shuxin Chen (zerotrac). MIT.
      VERIFIED 2026-08-04; see LEGAL.md. Community estimates, not authoritative
      LeetCode difficulty — every surface that renders one labels it as such.
      Weekly contests 1-62 carry no rating; fall back to Codrona IRT rather than
      emitting a null. Pin the upstream commit SHA at ingest.
    meta:
      licence: MIT
      legal_status: verified
      attribution: "Copyright (c) 2021 Shuxin Chen"
    tables:
      - name: raw_problem_ratings

  - name: aizu
    description: >
      Aizu Online Judge official API (judgeapi.u-aizu.ac.jp). PENDING PERMISSION;
      see LEGAL.md. No licence is stated anywhere on the developer site. A
      permission enquiry was sent to the University of Aizu on 2026-08-05 and no
      reply has been received. Do not ingest until one is recorded. Not required
      for Phase 1: historical Aizu submissions already arrive through the codenet
      source under CDLA-Permissive-2.0, and AOJ would only extend coverage past
      CodeNet's 2021 snapshot. No rate limit is published; the operator asks
      callers to avoid excessive concurrent requests, and a figure was requested
      in the same enquiry.
    meta:
      licence: none-stated
      legal_status: pending-permission
      permission_requested: "2026-08-05"
    tables: []

  - name: silver
    description: >
      Normalized Parquet produced by codrona_lens.normalize, not an external
      feed: provenance for its contents is the codeforces source above. The
      location is an environment variable so a snapshot can be substituted for
      the real silver build without editing a model — a hard-coded path would
      let stale input survive a rebuild silently.
    meta:
      licence: derived-see-codeforces-source
      legal_status: derived
    tables:
      - name: cf_submissions
        description: One row per Codeforces submission, deduplicated by id.
        meta:
          external_location: >-
            read_parquet('{{ env_var("CODRONA_SILVER_CF", env_var("HOME") ~
            "/codrona-data/lake/silver/cf_submissions") }}/**/*.parquet',
            hive_partitioning = true)
