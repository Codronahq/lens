# Every hook runs the binary from .venv, so the "rev pinned to a stale version"
# failure class cannot occur: pre-commit and CI execute the same versions by
# construction. mypy runs over the whole tree rather than only changed files,
# because replacing one module can break an untouched importer.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff
        args: [check, --fix]
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff
        args: [format]
        language: system
        types_or: [python, pyi, jupyter]

      # pyproject is in types_or because a commit touching only pyproject.toml
      # otherwise skips both of these entirely - and that file holds the
      # dependency pins as well as the ruff, mypy and pytest configuration, so
      # it is the file where "no Python changed" is least true. types_or and
      # files are ANDed, not ORed, so the tag is the mechanism rather than a
      # regex. identify emits a dedicated `pyproject` tag; `toml` would be
      # wider than intended and `yaml` would pull in all nineteen .yml files.
      - id: mypy
        name: mypy (src scripts tests)
        entry: .venv/bin/mypy
        args: [src, scripts, tests]
        language: system
        types_or: [python, pyi, pyproject]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        args: [-q]
        language: system
        types_or: [python, pyi, pyproject]
        pass_filenames: false

      - id: dbt-parse
        name: dbt parse
        entry: .venv/bin/dbt
        args: [parse, --target, ci]
        language: system
        pass_filenames: false
        files: '(\.sql|\.yml|\.yaml)$'
      # Freshness, not correctness. The pytest gate proves the committed export
      # is internally consistent; only a regeneration proves it still matches
      # the warehouse. Scoped to the models and the exporter, because nothing
      # else can make it stale. Exits 0 with a message where no warehouse
      # exists, since a contributor cannot regenerate it and must not be blocked.
      - id: observatory-export-current
        name: observatory export is current
        entry: .venv/bin/python
        args: [-m, codrona_lens.observatory.export, --verify-current]
        language: system
        pass_filenames: false
        files: '^(models/marts/observatory/|src/codrona_lens/observatory/)'

      - id: repo-checks
        name: repository hygiene
        entry: .venv/bin/python
        args: [scripts/repo_checks.py]
        language: system
        pass_filenames: false
        always_run: true
